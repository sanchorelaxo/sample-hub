[project]
name = "sample-hub"
version = "0.1.0"
description = "Cross-instrument sample workstation: one localhost UI, one conversion matrix"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_devices: requires a physical instrument attached; skipped unless --real-devices is passed",
]
